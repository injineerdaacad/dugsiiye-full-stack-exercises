<!DOCTYPE html>

    <meta name="author" content="Engineer Honest" />
    <title>Flex Box</title>

  <body class="flex justify-center items-center min-h-screen bg-gray-100">

      <div class="flex flex-col space-y-4 justify-center">

          <h2>About Me</h2>
        </div>

        <div>
          <p>
            I am a passionate developer who loves building responsive and
            user-friendly websites using modern tools and frameworks.
          </p>
        </div>

        <div class="bg-rose-500 text-white font-bold px-4 py-2 rounded hover:bg-rose-600 w-max">
          <button>Learn More</button>
        </div>
      </div>
    </div>
