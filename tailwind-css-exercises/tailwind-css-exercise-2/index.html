<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Engineer Honest" />
    <title>Grid Column</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="flex justify-center items-center min-h-screen bg-gray-100 p-6">

    <div class="grid grid-cols-3 gap-6 text-white text-lg w-full shadow-md">

      <div class="bg-blue-600 col-span-full rounded-xl p-12 shadow-md">
        <h2 class="font-bold text-2xl mb-2">Feature Content</h2>
        <p class="text-white">This spans across all columns.</p>
      </div>

      <div class="bg-green-600 col-span-2 rounded-xl p-8 shadow-md">
        <h2 class="font-semibold text-xl mb-1">Left Section</h2>
        <p class="text-white">Takes up 2 columns</p>
      </div>

      <div class="bg-green-600 rounded-xl p-8 shadow-md">
        <h2 class="font-semibold text-xl mb-1">Right Section</h2>
        <p class="text-white">Takes up 1 column</p>
      </div>

      <div class="bg-purple-600 rounded-xl p-8 shadow-md">
        <h2 class="font-semibold text-xl mb-1">Column 1</h2>
        <p class="text-white">Equal Width</p>
      </div>

      <div class="bg-purple-600 rounded-xl p-8 shadow-md">
        <h2 class="font-semibold text-xl mb-1">Column 2</h2>
        <p class="text-white">Equal Width</p>
      </div>

      <div class="bg-purple-600 rounded-xl p-8 shadow-md">
        <h2 class="font-semibold text-xl mb-1">Column 3</h2>
        <p class="text-white">Equal Width</p>
      </div>
      
    </div>
  </body>
</html>
