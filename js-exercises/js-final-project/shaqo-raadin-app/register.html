<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Shaqo Raadis</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body>
    <header role="banner">
      <nav class="navbar" aria-label="Main Navigation">
        <div class="brand-title">
          <i class="fas fa-briefcase"></i> Shaqo Raadis
        </div>

        <a href="#" class="toggle-button" aria-label="Toggle Navigation">
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </a>

        <div class="navbar-links">
          <ul>
            <li>
              <a href="index.html"><i class="fas fa-home"></i> Home</a>
            </li>
            <li>
              <a href="login.html"><i class="fas fa-sign-in-alt"></i> Login</a>
            </li>
            <li>
              <a href="register.html"
                ><i class="fas fa-user-plus"></i> Register</a
              >
            </li>
            <li>
              <button id="toggle-dark">
                <i class="fas fa-moon"></i> Dark/Light
              </button>
            </li>
          </ul>
        </div>
      </nav>
    </header>

    <main class="form-page">
      <form id="register-form">
        <h2><i class="fas fa-user-plus"></i> Register</h2>
        <input
          type="text"
          id="register-username"
          placeholder="Soo geli username-kaaga"
          required
        />
        <input
          type="password"
          id="register-password"
          placeholder="Soo geli password-kaaga"
          required
        />
        <input
          type="password"
          id="confirm-password"
          placeholder="Mar labaad geli password-ka"
          required
        />
        <button type="submit">Register</button>
        <p>You already have an account? <a href="login.html">Login</a></p>
      </form>
    </main>

    <footer class="site-footer" role="contentinfo">
      <p>&copy; 2025 Shaqo Raadis Online | Prepared by Engineer Honest</p>
      <p>
        <a href="https://shaqoraadis2025.com" target="_blank" rel="noopener"
          >shaqoraadis2025.com</a
        >
        |
        <a href="mailto:support@shaqoraadis.so">Contact</a>
      </p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
